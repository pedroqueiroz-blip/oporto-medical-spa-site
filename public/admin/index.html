<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice · Oporto Medical Spa</title>
<link rel="icon" href="/logo-brown.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap">
<style>
  /* Backoffice com as cores e as letras da marca. O Decap CMS gera os nomes das classes
     (css-xxxx-NomeDoComponente), por isso as regras apontam para o nome do componente. */
  :root {
    --night: #0D0A08; --cacao: #24180F; --walnut: #3B2919; --linen: #E8DCC8; --oat: #B5A288; --flame: #D9A86C;
    --bg: #F4EEE4; --card: #FFFCF7; --line: #E6DACA; --ink: #24180F; --muted: #7A6650; --soft: #F1E6D6;
    --display: "EB Garamond", Garamond, Georgia, serif; --body: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
  }
  html, body { background: var(--bg) !important; }
  body, button, input, textarea, select, [class*="-AppMainContainer"] { font-family: var(--body) !important; color: var(--ink); }
  ::selection { background: rgba(217, 168, 108, .35); }

  /* Topo */
  [class*="-AppHeader-css"] { background: var(--night) !important; box-shadow: none !important; border-bottom: 1px solid var(--walnut); }
  [class*="-AppHeaderContent"] { min-height: 68px; align-items: center; }
  [class*="-AppHeaderContent"]::before { content: ""; flex: none; width: 44px; height: 48px; margin: 0 28px 0 18px; background: url(/wordmark.svg) center / contain no-repeat; }
  [class*="-AppHeaderNavLink"], [class*="-AppHeaderButton"] { color: var(--oat) !important; font-weight: 400 !important; letter-spacing: .02em; }
  [class*="-AppHeaderNavLink"] svg, [class*="-AppHeaderButton"] svg { color: var(--oat) !important; }
  .header-link-active, .header-link-active svg, [class*="-AppHeaderNavLink"]:hover, [class*="-AppHeaderNavLink"]:hover svg { color: var(--linen) !important; }
  .header-link-active { box-shadow: inset 0 -2px 0 var(--flame); }
  [class*="-AppHeaderQuickNewButton"] { background: var(--flame) !important; color: var(--night) !important; border-radius: 999px !important; padding: 0 18px !important; font-weight: 500 !important; }
  [class*="-AppHeaderSiteLink"] { color: var(--oat) !important; }
  [class*="-AppHeaderSiteLink"]:hover { color: var(--linen) !important; }

  /* Cartões, barra lateral e listas */
  [class*="-card-card"], [class*="-ListCard-card"] { background: var(--card) !important; border-radius: 6px !important; box-shadow: 0 1px 0 var(--line), 0 10px 30px -22px rgba(36, 24, 15, .35) !important; }
  [class*="-SidebarHeading"], [class*="-CollectionTopHeading"] { font-family: var(--display) !important; font-weight: 400 !important; color: var(--night) !important; letter-spacing: -.01em; }
  [class*="-SidebarHeading"] { font-size: 28px !important; }
  [class*="-CollectionTopHeading"] { font-size: 36px !important; }
  [class*="-CollectionTopDescription"] { color: var(--muted) !important; font-size: 15px !important; line-height: 1.6 !important; }
  [class*="-SidebarNavLink"] { color: var(--muted) !important; border-left: 2px solid transparent !important; font-size: 15px !important; }
  [class*="-SidebarNavLink"] svg { color: var(--oat) !important; }
  [class*="-SidebarNavLink"] { background: transparent !important; }
  [class*="-SidebarNavLink"]:hover, [class*="-SidebarNavLink"].sidebar-active { color: var(--night) !important; background: var(--soft) !important; border-left-color: var(--flame) !important; }
  [class*="-SidebarNavLink"].sidebar-active svg { color: var(--flame) !important; }
  [class*="-SearchInput"] { background: var(--soft) !important; color: var(--ink) !important; border-radius: 999px !important; }
  [class*="-CollectionTopNewButton"], [class*="-CollectionTopNewButton"]:hover { background: var(--night) !important; color: var(--linen) !important; border-radius: 999px !important; padding: 0 22px !important; font-weight: 500 !important; letter-spacing: .04em; }
  [class*="-ViewControls"] [class*="-StyledDropdownButton"], [class*="-ViewControls"] [class*="-StyledDropdownButton"]::after { color: var(--walnut) !important; border-top-color: var(--walnut) !important; }
  [class*="-ViewControlsButton"] { color: var(--oat) !important; }
  [class*="-ControlButton-css"], [class*="-ControlButton-css"] * { color: var(--walnut) !important; }
  [class*="-ControlButton-css"]::after { border-top-color: var(--walnut) !important; }
  [class*="-ListCard-card"] { border-left: 3px solid transparent !important; transition: border-color .2s, transform .2s; }
  [class*="-ListCard-card"]:hover { border-left-color: var(--flame) !important; transform: translateX(2px); }
  [class*="-ListCardTitle"] { font-family: var(--display) !important; font-weight: 400 !important; font-size: 21px !important; color: var(--night) !important; }
  [class*="-GroupHeading"], h2[class*="-Group"] { font-family: var(--display) !important; font-weight: 400 !important; color: var(--walnut) !important; font-size: 26px !important; }

  /* Editor */
  [class*="-ToolbarContainer"] { background: var(--card) !important; border-bottom: 1px solid var(--line) !important; box-shadow: none !important; }
  [class*="-BackCollection"] { color: var(--muted) !important; }
  [class*="-ToolbarButton"], [class*="-PublishedButton"] { border-radius: 999px !important; }
  [class*="-PublishedToolbarButton"], [class*="-PublishedButton"], [class*="-StatusButton"] { background: var(--soft) !important; color: var(--walnut) !important; }
  [class*="-PublishedToolbarButton"]::after, [class*="-StatusButton"]::after { color: var(--walnut) !important; border-top-color: var(--walnut) !important; }
  [class*="-PublishButton"], [class*="-SaveButton"] { background: var(--walnut) !important; color: var(--linen) !important; }
  [class*="-DeleteButton"] { background: transparent !important; color: #a3442f !important; border: 1px solid #e3c2b8 !important; }
  [class*="-PreviewLink"] { color: var(--walnut) !important; }
  [class*="-ControlPaneContainer"]:not([class*="-PreviewPaneContainer-"]), [class*="-EditorContainer"], .Pane1 { background: var(--bg) !important; }
  [class*="-PreviewPaneContainer-ControlPaneContainer"] { background: var(--bg) !important; }
  .Resizer.vertical { background: var(--line) !important; border-color: var(--line) !important; width: 3px !important; }
  .Resizer.vertical::before { background: var(--flame) !important; }
  [class*="-FieldLabel"] { background: var(--soft) !important; color: var(--walnut) !important; border: 0 !important; border-radius: 4px 4px 0 0 !important; letter-spacing: .14em !important; font-weight: 600 !important; font-size: 11px !important; }
  [class*="-ControlContainer"]:focus-within [class*="-FieldLabel"] { background: var(--walnut) !important; color: var(--linen) !important; }
  [class*="-ControlContainer"] > div > input, [class*="-ControlContainer"] > input, [class*="-ControlContainer"] textarea,
  [class*="-ControlContainer"] [class*="-TextControl"], [class*="-ControlContainer"] > [class*="-InputContainer"] {
    background: var(--card) !important; border-color: var(--line) !important; border-radius: 0 6px 6px 6px !important; color: var(--ink) !important; font-size: 16px !important; }
  [class*="-ControlContainer"] input:focus, [class*="-ControlContainer"] textarea:focus { border-color: var(--walnut) !important; }
  [class*="-ControlHint"] { color: var(--muted) !important; font-size: 13px !important; line-height: 1.5 !important; }
  [class*="-ControlTopbar"] { background: var(--soft) !important; }
  [class*="-ObjectWidgetTopBar"], [class*="-ListItemTopBar"] { background: var(--soft) !important; }
  [class*="-FileWidgetButton"] { background: var(--night) !important; color: var(--linen) !important; border-radius: 999px !important; }
  [class*="-FileWidgetButtonRemove"] { background: transparent !important; color: #a3442f !important; border: 1px solid #e3c2b8 !important; }
  [class*="-ToggleBackground"] { background: var(--line) !important; }
  [class*="-ToggleContainer"][aria-checked="true"] [class*="-ToggleBackground"], [class*="-ToggleBackground"][class*="Active"] { background: var(--flame) !important; }
  [class*="-PreviewPaneContainer"]:not([class*="ControlPaneContainer"]) { background: var(--night) !important; }
  [class*="-EditorToggle"] { color: var(--walnut) !important; }
  a { color: var(--walnut); }

  /* Entrada */
  [class*="-StyledAuthenticationPage"] { background: var(--night) !important; }
  [class*="-StyledAuthenticationPage"] [class*="-CustomLogoIcon"] { border: 0 !important; }
  [class*="-LoginButton"] { background: var(--linen) !important; color: var(--night) !important; border-radius: 999px !important; padding: 0 30px !important; letter-spacing: .14em; text-transform: uppercase; font-size: 12px !important; }
  [class*="-StyledAuthenticationPage"] a { color: var(--oat) !important; }

  /* Pedido de palavra-passe, antes do Decap */
  .entrar { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 0; background: var(--night); }
  .entrar[hidden] { display: none; }
  .entrar img { width: 150px; margin-bottom: 26px; }
  .entrar input { box-sizing: border-box; width: min(320px, calc(100vw - 32px)); padding: 12px 14px; border: 1px solid rgba(232, 220, 200, .3); border-radius: 4px; background: transparent; color: var(--linen); font: 15px var(--body); }
  .entrar .erro { min-height: 20px; margin: 10px 0 0; color: #E0A58C; font-size: 13px; }
  .entrar button { margin-top: 6px; width: min(320px, calc(100vw - 32px)); padding: 12px; border: 0; border-radius: 999px; background: var(--linen); color: var(--night); font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  .entrar button:disabled { opacity: .6; }
  .verificar { position: fixed; left: 16px; bottom: 14px; z-index: 50; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 1px 0 var(--line); color: var(--muted) !important; font-size: 12px; text-decoration: none; }
  .verificar:hover { color: var(--night) !important; }
  .publicar-tudo { position: fixed; right: 28px; bottom: 28px; z-index: 300; background: var(--night); color: var(--linen); border: 0; border-radius: 999px; padding: 14px 28px; font: 600 12px Manrope, sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
  .publicar-tudo[hidden] { display: none; }
  .publicar-tudo:disabled { opacity: .7; cursor: wait; }
</style>
</head>
<body>
<form id="entrar" class="entrar" hidden>
  <img src="/logo-beige.svg" alt="Oporto Medical Spa">
  <input type="password" name="senha" placeholder="Palavra-passe" autocomplete="current-password" required>
  <p class="erro" aria-live="polite"></p>
  <button type="submit">Entrar</button>
</form>
<a class="verificar" href="/admin-verificar" target="_blank" rel="noopener">Verificar ligações</a>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
<script>
  /* Pré-visualizações com o aspeto do site (letras, cores e classes de /site.css) */
  CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500;600&display=swap');
  CMS.registerPreviewStyle('/site.css');
  CMS.registerPreviewStyle('body{background:#0D0A08;color:#E8DCC8;margin:0}.section{padding:44px 0}.wrap{padding-inline:28px}.pv-note{font:12px/1.5 Manrope,sans-serif;color:#B5A288;border-top:1px solid rgba(232,220,200,.14);margin-top:36px;padding-top:14px}.pv-img{width:100%;max-height:420px;object-fit:cover;border-radius:4px;margin-top:22px}.pv-list{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid rgba(232,220,200,.14)}.pv-list li{padding:16px 0;border-bottom:1px solid rgba(232,220,200,.14)}.pv-list b{display:block;font:400 22px/1.2 "EB Garamond",serif;margin-bottom:4px}.pv-list span{color:#B5A288;font-size:15px}.pv-off{padding:40px;font:15px Manrope,sans-serif;color:#B5A288}', { raw: true });

  var h = window.h;
  function inline(s) {
    return String(s || '').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; })
      .replace(/\[\[(.+?)\]\]/g, '<mark class="tbc">$1</mark>')
      .replace(/==(.+?)==/g, '<mark class="hl">$1</mark>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }
  function js(v) { return v && v.toJS ? v.toJS() : v; }
  function eur(n) { return n == null || n === '' ? '' : String(n).replace('.', ',') + ' €'; }
  function html(tag, props, s) { props = props || {}; props.dangerouslySetInnerHTML = { __html: inline(s) }; return h(tag, props); }
  function title(t, em, size) {
    return h('h2', { className: 'd', style: { fontSize: size || 'clamp(34px,5vw,58px)' } }, t || '', em ? ' ' : null, em ? h('em', {}, em) : null);
  }

  /* Campanhas: o bloco da campanha como aparece na página inicial */
  var CampanhaPreview = createClass({
    render: function () {
      var e = this.props.entry, get = function (k) { return e.getIn(['data', k]); };
      var off = !get('ativa') ? h('p', { className: 'pv-off' }, 'Esta campanha está desligada: não aparece no site.') : null;
      var img = get('imagem') ? this.props.getAsset(get('imagem')) : null;
      var inclui = js(get('inclui')) || [];
      var preco = get('preco');
      return h('div', {}, off, h('section', { className: 'section month2' },
        h('div', { className: 'wrap split' },
          img ? h('figure', { className: 'arch arch--photo' }, h('img', { src: img.toString(), alt: '' }))
              : h('figure', { className: 'arch' }, h('figcaption', {}, 'Fotografia · a enviar')),
          h('div', { style: { display: 'grid', gap: '24px' } },
            h('p', { className: 'kicker', style: { margin: 0 } }, get('etiqueta')),
            h('h2', { className: 'd sig-title' }, (get('titulo') || '') + ' ', get('titulo_destaque') ? h('em', {}, get('titulo_destaque')) : null,
              get('assinatura') ? h('span', { className: 'sig-by' }, get('assinatura')) : null),
            html('p', { style: { margin: 0, fontSize: '18px', maxWidth: '46ch' } }, get('texto')),
            get('selo') ? h('p', { className: 'sig-seal' }, h('span', { className: 'sig-seal__r' }, '®'), h('span', {}, get('selo_texto'), h('br'), h('b', {}, get('selo_numero')))) : null,
            inclui.length || get('duracao') ? h('ul', {},
              inclui.map(function (x, i) { return html('li', { key: i }, x); }),
              get('duracao') ? h('li', {}, 'Duração: ' + get('duracao') + ' min') : null) : null,
            h('div', { style: { display: 'flex', gap: '18px 28px', alignItems: 'center', flexWrap: 'wrap' } },
              h('span', { className: 'price-d' }, preco ? eur(preco) : 'Preço do tratamento escolhido'),
              get('preco_antigo') ? h('s', { style: { color: '#B5A288' } }, eur(get('preco_antigo'))) : null,
              h('span', { className: 'btn btn--primary' }, 'Reservar')),
            get('selo_em_campanha') ? h('p', { className: 'pv-note' }, 'O tratamento escolhido ganha o selo dourado «Em campanha» na lista de tratamentos.') : null
          )
        )
      ));
    }
  });
  CMS.registerPreviewTemplate('campanhas', CampanhaPreview);

  /* Zonas das páginas: etiqueta, título, texto, fotografia e as listas que tiverem */
  var SecaoPreview = createClass({
    render: function () {
      var d = js(this.props.entry.get('data')) || {}, self = this;
      var img = d.imagem ? this.props.getAsset(d.imagem) : null;
      var lista = d.pilares || d.passos || d.lista || [];
      var extra = [];
      ['resumo', 'citacao', 'escolher_texto', 'nota', 'confianca', 'confianca_nota', 'onde_texto', 'nota_fisio'].forEach(function (k) {
        if (d[k]) extra.push(html('p', { key: k, className: 'prose', style: k === 'resumo' ? { color: '#E8DCC8' } : {} }, d[k]));
      });
      var t = d.titulo || d.escolher_titulo || d.onde_titulo, em = d.titulo_destaque || d.escolher_destaque || d.onde_destaque;
      var seo = d.descricao !== undefined && !d.etiqueta;
      return h('section', { className: 'section' }, h('div', { className: 'wrap' },
        seo ? h('div', { style: { background: '#fff', color: '#202124', padding: '22px 26px', borderRadius: '8px', fontFamily: 'Arial,sans-serif', maxWidth: '640px' } },
          h('div', { style: { fontSize: '13px', color: '#4d5156' } }, 'oportomedicalspa.com'),
          h('div', { style: { fontSize: '20px', color: '#1a0dab', margin: '4px 0' } }, d.titulo),
          h('div', { style: { fontSize: '14px', color: '#4d5156' } }, d.descricao || 'Descrição escrita sozinha com os preços e a campanha do mês.')) : null,
        d.etiqueta ? h('p', { className: 'kicker' }, d.etiqueta) : null,
        !seo && t ? title(t, em) : null,
        d.texto ? html('p', { className: 'prose' }, d.texto) : null,
        extra,
        d.botao ? h('p', { style: { marginTop: '26px' } }, h('span', { className: 'btn btn--primary' }, d.botao)) : null,
        img ? h('img', { className: 'pv-img', src: img.toString(), alt: '' }) : null,
        lista.length ? h('ul', { className: 'pv-list' }, lista.map(function (x, i) {
          var pic = x.imagem ? self.props.getAsset(x.imagem) : null;
          return h('li', { key: i },
            pic ? h('img', { src: pic.toString(), alt: '', style: { width: '96px', height: '96px', objectFit: 'cover', float: 'right', marginLeft: '16px', borderRadius: '4px' } }) : null,
            h('b', {}, x.titulo || x.pergunta || ''), html('span', {}, x.texto || x.resposta || (x.automatica ? 'Resposta automática, com os preços e contactos atuais.' : '')));
        })) : null,
        h('p', { className: 'pv-note' }, 'Pré-visualização aproximada. O aspeto final vê-se no rascunho do site, em «Ver pré-visualização».')
      ));
    }
  });
  ['topo', 'cuidar', 'rituais', 'visita', 'equipa_intro', 'reservar', 'oferecer', 'afiliacoes', 'avaliacoes', 'perguntas', 'como_chegar', 'google', 'tabela', 'onde']
    .forEach(function (n) { CMS.registerPreviewTemplate(n, SecaoPreview); });

  /* Páginas de tratamentos: o topo, as perguntas e o resultado no Google */
  var PaginaPreview = createClass({
    render: function () {
      var d = js(this.props.entry.get('data')) || {}, p = this.props;
      var seo = d.seo || {}, q = d.perguntas || {};
      var topo = { etiqueta: d.etiqueta, titulo: d.titulo, titulo_destaque: d.titulo_destaque, texto: d.texto, citacao: d.citacao, nota: d.nota, lista: q.lista || [] };
      var fake = function (data) { return { get: function () { return data; } }; };
      return h('div', {},
        h('p', { className: 'pv-note', style: { padding: '24px 0 0 40px' } }, 'oportomedicalspa.com/' + (d.endereco || '') + '/ · área ' + (d.grupo || '') + ': os tratamentos, preços e durações vêm de «Tratamentos e preços».'),
        h(SecaoPreview, { entry: fake(topo), getAsset: p.getAsset }),
        h(SecaoPreview, { entry: fake({ titulo: seo.titulo, descricao: seo.descricao || '' }), getAsset: p.getAsset }));
    }
  });
  CMS.registerPreviewTemplate('paginas', PaginaPreview);

  /* Tratamentos: a linha como aparece em «Rituais e tratamentos» */
  var TratamentoPreview = createClass({
    render: function () {
      var d = js(this.props.entry.get('data')) || {};
      return h('section', { className: 'section' }, h('div', { className: 'wrap' },
        h('p', { className: 'kicker' }, d.grupo || ''),
        h('div', { className: 'rituals', style: { marginTop: '10px' } },
          h('div', { className: 'ritual' },
            h('h3', {}, h('small', {}, (d.tipo_servico || '')), d.nome || ''),
            html('p', {}, d.texto),
            h('span', { className: 'ritual__price' }, h('span', {}, (d.duracao || '') + ' min'), eur(d.preco)),
            h('button', { type: 'button' }, '→'))),
        d.indicado_para ? h('p', { className: 'prose' }, h('b', { style: { color: '#E8DCC8', fontWeight: 500 } }, 'Indicado para: '), d.indicado_para) : null,
        h('p', { className: 'pv-note' }, d.visivel === false ? 'Escondido: não aparece no site, na agenda nem nos vouchers.' :
          'Fatura como ' + (d.grupo === 'Relaxar' ? 'TPREV · Terapêuticas de Prevenção' : 'TREAB · Terapêuticas de Reabilitação') + ', isento de IVA.')
      ));
    }
  });
  CMS.registerPreviewTemplate('tratamentos', TratamentoPreview);

  /* Equipa: o cartão de «Quem cuida de si» */
  var PessoaPreview = createClass({
    render: function () {
      var d = js(this.props.entry.get('data')) || {};
      var foto = d.foto && d.mostrar_foto !== false ? this.props.getAsset(d.foto) : null;
      return h('section', { className: 'section' }, h('div', { className: 'wrap' }, h('article', { className: 'tm-card', style: { maxWidth: '300px' } },
        foto ? h('img', { src: foto.toString(), alt: '', style: { aspectRatio: '4/5', objectFit: 'cover', borderRadius: '160px 160px 0 0', marginBottom: '16px', width: '100%' } })
             : null,
        h('p', { className: 'tm-card__role' }, d.funcao || ''), h('h3', { className: 'tm-card__name' }, d.nome || ''),
        h('p', { className: 'tm-card__focus' }, d.foco || ''), h('p', { className: 'tm-card__bio' }, d.bio || ''),
        h('span', { className: 'tm-card__cta' }, 'Marcar com ' + String(d.nome || '').split(' ')[0]))));
    }
  });
  CMS.registerPreviewTemplate('equipa', PessoaPreview);

  /* Entrada com a palavra-passe da equipa (netlify/functions/admin-entrar.mjs), logo nesta página, sem o botão do GitHub.
     A chave devolvida fica onde o Decap guarda a sessão (decap-cms-user). Sem a palavra-passe definida no Netlify,
     aparece a entrada do Decap com conta GitHub, como antes. */
  (function () {
    var CHAVE = 'decap-cms-user';
    var iniciar = function () {
      CMS.init({ config: { backend: { base_url: location.origin, auth_endpoint: 'admin-entrar' } } });
      // Ao sair (ou se a chave deixar de valer), o Decap apaga a sessão guardada: volta-se ao pedido de palavra-passe.
      // (A página de entrada do Decap também aparece enquanto confirma a chave, por isso não serve de sinal.)
      if (!document.body.dataset.palavraPasse) return;
      setInterval(function () {
        var ainda = true;
        try { ainda = !!localStorage.getItem(CHAVE); } catch (e) {}
        if (!ainda) location.reload();
      }, 500);
    };
    var sessao = null;
    try { sessao = JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) {}
    if (sessao && sessao.token) { document.body.dataset.palavraPasse = '1'; return iniciar(); }

    var f = document.getElementById('entrar');
    var erro = f.querySelector('.erro');
    var pedir = function (corpo) {
      return fetch('/admin-entrar', { method: corpo ? 'POST' : 'GET', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined })
        .then(function (r) { return r.json().then(function (j) { j.status = r.status; return j; }, function () { return { status: r.status }; }); });
    };
    pedir().then(function (j) {
      if (j.configurada === false || j.status >= 500) return iniciar();
      document.body.dataset.palavraPasse = '1';
      f.hidden = false;
      f.querySelector('input').focus();
    }, iniciar);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var botao = f.querySelector('button');
      botao.disabled = true; erro.textContent = '';
      pedir({ senha: f.querySelector('input').value }).then(function (j) {
        botao.disabled = false;
        if (!j.token) { erro.textContent = j.erro || 'Não foi possível entrar. Tente de novo.'; return; }
        try { localStorage.setItem(CHAVE, JSON.stringify({ token: j.token, backendName: 'github' })); } catch (e) {}
        f.remove();
        iniciar();
      }, function () { botao.disabled = false; erro.textContent = 'Sem ligação. Tente de novo.'; });
    });
  })();

  /* «Publicar tudo» no Fluxo de trabalho: publica de uma vez todas as alterações em rascunho, em revisão ou prontas.
     Faz o mesmo que o botão Publicar de cada uma (junta o rascunho ao site no GitHub e apaga o rascunho),
     com a sessão de quem entrou. O site atualiza-se sozinho a seguir. */
  (function () {
    var REPO = 'pedroqueiroz-blip/oporto-medical-spa-site', RAMO = 'main';
    var API = 'https://api.github.com/repos/' + REPO;
    var token = function () { try { return (JSON.parse(localStorage.getItem('decap-cms-user') || '{}') || {}).token; } catch (e) { return null; } };
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'publicar-tudo'; b.textContent = 'Publicar tudo'; b.hidden = true;
    document.body.appendChild(b);
    var ver = function () { b.hidden = !/^#\/workflow/.test(location.hash) || !token(); };
    window.addEventListener('hashchange', ver); setInterval(ver, 1000);

    var gh = function (url, opts) {
      opts = opts || {};
      opts.headers = { Authorization: 'token ' + token(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
      return fetch(url.indexOf('http') ? API + url : url, opts).then(function (r) {
        return r.status === 204 ? {} : r.json().then(function (j) { if (!r.ok) throw Object.assign(new Error(j.message || r.status), { status: r.status }); return j; });
      });
    };
    var nome = function (pr) { var t = pr.title.replace(/^Backoffice:\s*/, ''); return t.charAt(0).toUpperCase() + t.slice(1); };

    b.addEventListener('click', function () {
      if (!token()) { alert('Entre no backoffice primeiro.'); return; }
      b.disabled = true; b.textContent = 'A procurar rascunhos…';
      gh('/pulls?state=open&per_page=100&base=' + RAMO).then(function (prs) {
        prs = prs.filter(function (p) { return p.head.ref.indexOf('cms/') === 0; });
        if (!prs.length) { alert('Não há alterações por publicar.'); return null; }
        var lista = prs.map(function (p) { return '• ' + nome(p); }).join('\n');
        if (!confirm('Publicar estas ' + prs.length + ' alterações no site?\n\n' + lista)) return null;
        var falhas = [], i = 0;
        var seguinte = function () {
          if (i >= prs.length) return falhas;
          var p = prs[i++];
          b.textContent = 'A publicar ' + i + ' de ' + prs.length + '…';
          return gh('/pulls/' + p.number + '/merge', { method: 'PUT', body: JSON.stringify({ commit_message: 'Automatically generated. Merged on Decap CMS.', sha: p.head.sha, merge_method: 'merge' }) })
            .then(function () { return gh('/git/refs/heads/' + p.head.ref.split('/').map(encodeURIComponent).join('/'), { method: 'DELETE' }).catch(function () {}); })
            .catch(function (e) { falhas.push(nome(p) + (e.status === 405 || e.status === 409 ? ' (em conflito com outra alteração: publique-a sozinha)' : ' (' + e.message + ')')); })
            .then(seguinte);
        };
        return seguinte();
      }).then(function (falhas) {
        if (falhas == null) return;
        alert(falhas.length ? 'Algumas alterações não foram publicadas:\n\n' + falhas.join('\n') : 'Publicado. O site atualiza-se dentro de um ou dois minutos.');
        location.reload();
      }, function (e) {
        alert('Não foi possível publicar: ' + e.message);
      }).then(function () { b.disabled = false; b.textContent = 'Publicar tudo'; });
    });
  })();
</script>
