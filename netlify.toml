# O site é gerado a partir de content/ (editado no backoffice em /admin) e public/.
[build]
  command = "node src/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/massagens-porto.html"
  to = "/massagens-porto/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Pagamentos (euPago), faturação (Moloni ON) e emails: netlify/functions, código em servidor/.
# As chaves ficam só nas variáveis de ambiente do Netlify (ver docs/integracoes.md).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
